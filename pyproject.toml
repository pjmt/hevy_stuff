[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hevy"
version = "0.1.0"
description = "Hevy experiments and scripts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
hevy = "hevy.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/hevy"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests requiring network/credentials",
]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["hevy"]
mypy_path = "src"